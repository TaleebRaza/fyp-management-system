services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.42@sha256:f7cbc8bdbbf60a1aaba7d61784a3bdff3ec1e0657f6ad0b26d5b6ab2cd9d0dc6
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.externalUrl=${S3_BROWSER_ENDPOINT:?S3_BROWSER_ENDPOINT is required for local storage.}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${FYP_SEAWEEDFS_DATA_DIR:-/var/lib/fyp-portal/seaweedfs}
        target: /data

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.42@sha256:f7cbc8bdbbf60a1aaba7d61784a3bdff3ec1e0657f6ad0b26d5b6ab2cd9d0dc6
    depends_on:
      seaweedfs:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/seaweedfs-init.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required for local storage.}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required for local storage.}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required for local storage.}
    restart: "no"
    volumes:
      - type: bind
        source: ./seaweedfs-init.sh
        target: /scripts/seaweedfs-init.sh
        read_only: true

  storage-init:
    image: ${FYP_PORTAL_IMAGE:-fyp-portal:local}
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    command: ["node", "deploy/initialize-local-storage.mjs"]
    environment:
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?PORTAL_PUBLIC_URL is required for local storage.}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required for local storage.}
      S3_BROWSER_ENDPOINT: ${S3_BROWSER_ENDPOINT:?S3_BROWSER_ENDPOINT is required for local storage.}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required for local storage.}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required for local storage.}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_REGION: ${S3_REGION:?S3_REGION is required for local storage.}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required for local storage.}
    restart: "no"

  app:
    depends_on:
      storage-init:
        condition: service_completed_successfully

  caddy:
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./Caddyfile.local-storage
        target: /etc/caddy/Caddyfile
        read_only: true
