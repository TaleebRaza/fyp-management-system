name: fyp-portal

services:
  app:
    image: ${FYP_PORTAL_IMAGE:?FYP_PORTAL_IMAGE is required.}
    pull_policy: always
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required.}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required.}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required.}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BROWSER_ENDPOINT: ${S3_BROWSER_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      FYP_BACKUP_WORKSPACE: /backups
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    volumes:
      - type: bind
        source: ${FYP_BACKUP_STAGING_DIR:-/var/lib/fyp-portal/backups/.staging}
        target: /backups
