name: fyp-portal

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${FYP_PORTAL_IMAGE:-fyp-portal:local}
    env_file:
      - ${FYP_PORTAL_ENV_FILE:-/etc/fyp-portal/portal.env}
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
