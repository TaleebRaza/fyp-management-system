name: Prepare release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0

      - name: Install and test application dependencies
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run test:unit

      - name: Test installer
        run: go test ./...

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fyp-portal" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: image-build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build release binaries and archive
        run: |
          mkdir -p dist/bin
          go build -trimpath -buildvcs=false -ldflags "-s -w -X github.com/fyp-portal/installer/internal/operations.cliVersion=${VERSION} -X github.com/fyp-portal/installer/internal/operations.releaseCommit=${GITHUB_SHA}" -o dist/bin/install ./cmd/install
          go build -trimpath -buildvcs=false -ldflags "-s -w -X github.com/fyp-portal/installer/internal/operations.cliVersion=${VERSION} -X github.com/fyp-portal/installer/internal/operations.releaseCommit=${GITHUB_SHA}" -o dist/bin/fypctl ./cmd/fypctl
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/package-release.mjs --version "$VERSION" --image "${{ steps.image.outputs.name }}@${{ steps.image-build.outputs.digest }}" --commit "$GITHUB_SHA" --install dist/bin/install --fypctl dist/bin/fypctl

      - name: Attest installer archive
        uses: actions/attest@v4
        with:
          subject-path: dist/fyp-portal-${{ env.VERSION }}-linux-amd64.tar.gz

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "dist/fyp-portal-${VERSION}-linux-amd64.tar.gz" \
            "dist/fyp-portal-${VERSION}-linux-amd64.tar.gz.sha256" \
            "dist/release-manifest-${VERSION}.json" \
            --draft \
            --verify-tag \
            --title "FYP Portal ${VERSION}"
