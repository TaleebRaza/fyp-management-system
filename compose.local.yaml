services:
  mongo:
    image: mongo:7.0.41-jammy
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0.41-jammy
    network_mode: service:mongo
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --quiet 'mongodb://127.0.0.1:27017/admin?directConnection=true' --eval '
          try {
            rs.status();
          } catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
          }
          while (!db.hello().isWritablePrimary) sleep(250);
          const localDb = db.getSiblingDB("fyp_local");
          localDb.systemconfigs.updateOne(
            { configKey: "storage" },
            { $$setOnInsert: { configKey: "storage", usedBytes: 0, reservedBytes: 0, createdAt: new Date(), updatedAt: new Date() } },
            { upsert: true }
          );
          if (localDb.systemconfigs.countDocuments({ configKey: "storage" }) !== 1) {
            throw new Error("Expected exactly one storage ledger record.");
          }
        '
    restart: "no"

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fyp-local
      MINIO_ROOT_PASSWORD: fyp-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mcli alias set local http://minio:9000 fyp-local fyp-local-secret; do sleep 1; done
        mcli mb --ignore-existing local/fyp-local
        mcli cors set local/fyp-local /config/minio-cors.xml
    volumes:
      - ./docker/minio-cors.xml:/config/minio-cors.xml:ro
    restart: "no"

volumes:
  mongo-data:
  minio-data:
